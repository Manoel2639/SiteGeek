<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChibiKitchen</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- TOPO -->
  <header class="topo">
    <a class="logo" href="index.html">
      <img src="imgs/logo.png" alt="Logo ChibiKitchen">
      <span>Chibi<b>Kitchen</b></span>
    </a>
  </header>

  <!-- APRESENTAÇÃO -->
  <section class="hero">
    <h1>Anime na sua <span>cozinha</span></h1>
    <p>Receitas de verdade inspiradas nos animes que você ama.</p>
  </section>

  <!-- RECEITAS -->
  <main class="conteudo">
    <h2>Receitas</h2>

    <div class="grade">
      <a class="poster laranja" href="receita.html">
        <span class="emoji"></span>
        <h3>Ramen do Naruto</h3>
        <small>Naruto · 1h15</small>
      </a>

      <a class="poster vermelho" href="receita-2.html">
        <span class="emoji"></span>
        <h3>Arroz Frito do Sanji</h3>
        <small>One Piece · 25 min</small>
      </a>

      <a class="poster roxo" href="receita-3.html">
        <span class="emoji"></span>
        <h3>Cola do Senku</h3>
        <small>Dr. Stone · 30 min</small>
      </a>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer>© 2026 ChibiKitchen</footer>

</body>
</html>
