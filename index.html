<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChibiKitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- fundo do anime (aparece ao passar o mouse nos pôsteres) -->
    <div class="fundo-anime" id="fundo-anime" aria-hidden="true"></div>

    <!-- TOPO -->
    <header class="topo">
        <a class="logo" href="index.html">
            <img src="imgs/logo.png" alt="Logo ChibiKitchen">
            <span>Chibi<b>Kitchen</b></span>
        </a>
    </header>

    <!-- APRESENTAÇÃO -->
    <section class="hero">
        <h1>Anime na sua <span>cozinha</span></h1>
        <p>Receitas de verdade inspiradas nos animes que você ama.</p>
    </section>

    <!-- RECEITAS -->
    <main class="conteudo">
        <h2>Receitas</h2>

        <div class="grade">

            <!-- Pôster: imagem do cartão (src="..." da <img>).
             Fundo ao passar o mouse: outra imagem, indicada em data-fundo="..." no <a>.
             Coloque os fundos em imgs/fundos/ (naruto.jpg, sanji.jpg, senku.jpg, vegeta.jpg). -->
            <a class="poster" href="receita.html?id=naruto" data-fundo="imgs/fundos/naruto.jpg" style="--cor:#ff9f1c">
                <img src="imgs/Naruto.jpg" alt="Ramen do Naruto">
                <div class="texto">
                    <h3>Ramen do Naruto</h3>
                    <small>Naruto · 2h30</small>
                </div>
            </a>

            <a class="poster" href="receita.html?id=sanji" data-fundo="imgs/fundos/sanji.jpg" style="--cor:#e63946">
                <img src="imgs/Sanji.jpg" alt="Arroz Frito do Sanji">
                <div class="texto">
                    <h3>Arroz Frito do Sanji</h3>
                    <small>One Piece · 25 min</small>
                </div>
            </a>

            <a class="poster" href="receita.html?id=senku" data-fundo="imgs/fundos/senku.jpg" style="--cor:#9d4edd">
                <img src="imgs/Doutor.jpg" alt="Cola do Senku">
                <div class="texto">
                    <h3>Cola do Senku</h3>
                    <small>Dr. Stone · 30 min</small>
                </div>
            </a>

            <a class="poster" href="receita.html?id=vegeta" data-fundo="imgs/fundos/vegeta.jpg" style="--cor:#3a86ff">
                <img src="imgs/Vegeta.jpg" alt="Takoyaki do Vegeta">
                <div class="texto">
                    <h3>Takoyaki do Vegeta</h3>
                    <small>Dragon Ball Super · 40 min</small>
                </div>
            </a>

        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>© 2026 ChibiKitchen</footer>

    <script src="index.js"></script>

</body>

</html>
