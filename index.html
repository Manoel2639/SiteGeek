<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChibiKitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- TOPO -->
    <header class="topo">
        <a class="logo" href="index.html">
            <img src="logo.png" alt="Logo ChibiKitchen">
            <span>Chibi<b>Kitchen</b></span>
        </a>
    </header>

    <!-- APRESENTAÇÃO -->
    <section class="hero">
        <h1>Anime na sua <span>cozinha</span></h1>
        <p>Receitas de verdade inspiradas nos animes que você ama.</p>
    </section>

    <!-- RECEITAS -->
    <main class="conteudo">
        <h2>Receitas</h2>

        <div class="grade">

            <!-- Para trocar a imagem do pôster, mude o nome em src="..." -->
            <a class="poster" href="receita.html">
                <img src="naruto-poster.jpg" alt="Ramen do Naruto">
                <div class="texto">
                    <h3>Ramen do Naruto</h3>
                    <small>Naruto · 2h30</small>
                </div>
            </a>

            <a class="poster" href="receita-2.html">
                <img src="sanji-poster.jpg" alt="Arroz Frito do Sanji">
                <div class="texto">
                    <h3>Arroz Frito do Sanji</h3>
                    <small>One Piece · 25 min</small>
                </div>
            </a>

            <a class="poster" href="receita-3.html">
                <img src="senku-poster.jpg" alt="Cola do Senku">
                <div class="texto">
                    <h3>Cola do Senku</h3>
                    <small>Dr. Stone · 30 min</small>
                </div>
            </a>

            <a class="poster" href="receita-4.html">
                <img src="vegeta-poster.jpg" alt="Takoyaki do Vegeta">
                <div class="texto">
                    <h3>Takoyaki do Vegeta</h3>
                    <small>Dragon Ball Super · 40 min</small>
                </div>
            </a>

        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>© 2026 ChibiKitchen</footer>

</body>

</html>
