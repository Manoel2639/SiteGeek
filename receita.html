<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receita - ChibiKitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="receita.css">
</head>

<body>

    <header class="topo">
        <a class="logo" href="index.html">
            <img src="imgs/logo.png" alt="Logo ChibiKitchen">
            <span>Chibi<b>Kitchen</b></span>
        </a>
        <nav class="menu-topo">
            <a class="btn-cadastro" href="cadastro.html">Cadastre-se</a>
        </nav>
    </header>

    <!-- Esta página serve para TODAS as receitas: o conteúdo vem do arquivo dados.js (?id=naruto, ?id=sanji...) -->
    <main class="conteudo" id="app">
        <p class="caminho"><a href="index.html">Início</a> / <span id="cam-anime"></span></p>

        <div class="capa" id="capa">
            <img class="capa-logo" id="capa-logo" alt="" hidden>
            <span id="capa-emoji"></span>
        </div>

        <h1 id="titulo"></h1>
        <p class="sub" id="sub"></p>

        <div class="info" id="info"></div>

        <!-- ABAS: cada uma é uma "página" da receita -->
        <nav class="abas" role="tablist" aria-label="Partes da receita">
            <button id="aba-visao" data-ir="visao" role="tab">Visão geral</button>
            <button id="aba-ingredientes" data-ir="ingredientes" role="tab">Ingredientes</button>
            <button id="aba-preparo" data-ir="preparo" role="tab">Preparo</button>
        </nav>

        <!-- PÁGINA 1: visão geral -->
        <section class="pagina" id="pg-visao">
            <h2>Cena do anime</h2>
            <p class="intro" id="intro"></p>

            <h2>Ficha da receita</h2>
            <div class="ficha" id="ficha"></div>

            <h3>Utensílios</h3>
            <ul class="chips" id="utensilios"></ul>

            <p class="dica" id="dica"></p>
        </section>

        <!-- PÁGINA 2: ingredientes (com checklist) -->
        <section class="pagina" id="pg-ingredientes" hidden>
            <h2>Ingredientes</h2>
            <p class="contador" id="contador"></p>
            <div id="ingredientes"></div>
        </section>

        <!-- PÁGINA 3: passo a passo, um passo por vez -->
        <section class="pagina" id="pg-preparo" hidden>
            <h2>Modo de preparo</h2>

            <div class="passo" aria-live="polite">
                <span class="num" id="passo-num"></span>
                <h3 id="passo-titulo"></h3>
                <p id="passo-texto"></p>
            </div>
        </section>

        <!-- BARRA FIXA PARA PASSAR AS PÁGINAS (sempre visível, no fim da tela) -->
        <nav class="paginacao" aria-label="Passar página">
            <button class="btn sec" id="ant" type="button">← Anterior</button>
            <div class="pos">
                <span id="pos-texto"></span>
                <div class="barra">
                    <div id="barra"></div>
                </div>
            </div>
            <button class="btn" id="prox" type="button">Próxima →</button>
        </nav>

        <a class="voltar" href="index.html">← Voltar para o início</a>
    </main>

    <footer>© 2026 ChibiKitchen</footer>

    <!-- PERSONAGEM NO CANTO (clique nele!). Imagem: imgs/personagens/<id>.png -->
    <aside class="personagem" id="personagem">
        <div class="fala" id="fala" role="status"></div>
        <button class="avatar" id="avatar" type="button">
            <img id="pers-img" alt="">
            <span id="pers-emoji" aria-hidden="true"></span>
        </button>
    </aside>

    <script src="dados.js"></script>
    <script src="receita.js"></script>

</body>

</html>
